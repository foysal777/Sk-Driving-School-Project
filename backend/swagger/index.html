<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveMaster API Documentation | Swagger UI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <!-- Swagger UI CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui.css">
  
  <style>
    :root {
      --primary: #2A6B5C;
      --primary-dark: #183e35;
      --accent-green: #00b060;
    }
    body {
      margin: 0;
      padding: 0;
      background: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .custom-swagger-header {
      background: linear-gradient(135deg, #133a30 0%, #1e4d40 100%);
      color: #ffffff;
      padding: 1rem 2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent-green);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #ffffff;
    }
    .brand-logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ffffff;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.25rem;
    }
    .brand-text h1 {
      margin: 0;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
    }
    .brand-text span {
      font-size: 0.78rem;
      color: #a7f3d0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .btn-header-link {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0.45rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .btn-header-link:hover {
      background: #ffffff;
      color: var(--primary-dark);
    }
    .btn-header-primary {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: #ffffff;
    }
    .btn-header-primary:hover {
      background: #009652;
      color: #ffffff;
    }
    /* Swagger overrides */
    .swagger-ui .topbar { display: none; }
    .swagger-ui {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    .swagger-ui .info {
      margin: 1.5rem 0 2rem;
      background: #ffffff;
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.03);
    }
    .swagger-ui .info .title {
      font-family: 'Space Grotesk', sans-serif;
      color: #0f172a;
    }
    .swagger-ui .btn.authorize {
      background-color: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      border-radius: 8px;
    }
    .swagger-ui .btn.authorize svg { fill: #ffffff; }
    .swagger-ui .opblock {
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
  </style>
</head>
<body>

  <!-- Custom Header Strip -->
  <header class="custom-swagger-header">
    <a href="/index.html" class="brand-wrap">
      <div class="brand-logo-badge">🚗</div>
      <div class="brand-text">
        <h1>DriveMaster API</h1>
        <span>Core PHP 8+ &bull; MySQL &bull; OpenAPI 3.0</span>
      </div>
    </a>

    <div class="header-actions">
      <a href="/admin/" class="btn-header-link btn-header-primary">
        🔐 Admin Panel
      </a>
      <a href="/backend/install.php" class="btn-header-link">
        🛠️ DB Installer
      </a>
      <a href="/contact.html" class="btn-header-link">
        🌐 Website
      </a>
    </div>
  </header>

  <!-- Swagger UI Mount Point -->
  <div id="swagger-ui"></div>

  <!-- Swagger UI Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        docExpansion: "list",
        defaultModelsExpandDepth: 1,
        displayRequestDuration: true,
        filter: true
      });
    };
  </script>
</body>
</html>
